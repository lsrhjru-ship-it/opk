<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>경찰청 인트라넷</title>

    <!-- 디스코드 / SNS 링크 미리보기 (Open Graph) 설정 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="보안국 인트라넷" />
    <meta property="og:title" content="보안국 인트라넷" />
    <meta property="og:description" content="보안국" />
    <!-- 썸네일로 띄울 이미지 URL (app.js의 LOGO_URL과 동일한 로고로 통일) -->
    <meta property="og:image"
        content="https://cdn.discordapp.com/attachments/1531501210610434168/1536237644843982888/8D4AAAAASUVORK5CYII.png?ex=6a7aac4c&is=6a795acc&hm=68f874315d648df6b51ad41a2ee748aeddb8f6c7d930768b3d17a21a3180d580" />
    <!-- 디스코드 임베드 좌측 포인트 라인 색상 (보안국 시그니처 골드색) -->
    <meta name="theme-color" content="#A87030" />

    <!-- 브라우저 탭 파비콘도 동일한 로고로 통일 -->
    <link rel="icon" type="image/png"
        href="https://cdn.discordapp.com/attachments/1531501210610434168/1536237644843982888/8D4AAAAASUVORK5CYII.png?ex=6a7aac4c&is=6a795acc&hm=68f874315d648df6b51ad41a2ee748aeddb8f6c7d930768b3d17a21a3180d580" />

    <!-- 로고를 최대한 빨리 받아오도록 미리 로드 (초기 로딩 체감 속도 개선) -->
    <link rel="preload" as="image" crossorigin="anonymous"
        href="https://cdn.discordapp.com/attachments/1531501210610434168/1536237644843982888/8D4AAAAASUVORK5CYII.png?ex=6a7aac4c&is=6a795acc&hm=68f874315d648df6b51ad41a2ee748aeddb8f6c7d930768b3d17a21a3180d580" />

    <!-- 고급 Pretendard 폰트 & 엑셀 라이브러리 -->
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- 분리된 CSS 파일 연결 -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="app"></div>
    <div id="toast" style="display:none;"></div>

    <!-- 분리된 JS 파일 연결 -->
    <script src="app.js"></script>
</body>

</html>
